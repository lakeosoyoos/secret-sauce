name: Build Windows EXE

# Builds the Secret Sauce desktop app into a Windows x86-64 .exe on a real
# Windows runner, then uploads it as a downloadable artifact. No local Windows
# machine needed — trigger from the GitHub "Actions" tab (Run workflow), or it
# runs automatically whenever anything in desktop/ changes.

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write          # needed to publish the Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      # Python 3.11, NOT 3.12: we pin setuptools==65.5.1 (to avoid the newer
      # setuptools "InvalidVersion" launch crash), but 65.5.1's pkg_resources
      # uses pkgutil.ImpImporter, which Python 3.12 REMOVED — so on 3.12 the
      # packaged app dies at startup with "module 'pkgutil' has no attribute
      # 'ImpImporter'". 3.11 still has ImpImporter, so 3.11 + setuptools 65.5.1
      # is the combination that actually launches. (Boot self-test enforces it.)
      - name: Set up Python 3.11 (x86-64)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          REM Pin setuptools LAST so the runtime pkg_resources is the lenient
          REM 65.5.1 (newer setuptools crashes the packaged app at launch).
          python -m pip install "setuptools==65.5.1"
        shell: cmd

      # Filename -> fiber-number regression sweep. Locks in the four EXFO
      # filename bug patterns (trailing space, multi-λ suffix, AppleDouble
      # sidecars, multi-cable collisions) hardened in _extract_fiber_num — a
      # regression here fails the build BEFORE the Release publishes. See the
      # sibling fix in splice-report (commit 05eabe2).
      - name: Filename regression sweep (must pass, or fail the build)
        run: python test_filenames.py
        shell: cmd

      # End-to-end + edge-case test suite. Drives the real engines and the
      # Streamlit "Run analysis" flow against tiny committed fixtures, so an
      # engine or UI regression fails HERE — in seconds — before the multi-
      # minute PyInstaller build and long before the Release publishes.
      # PYTHONIOENCODING=utf-8: Windows defaults to cp1252, which crashes when
      # a test name or assertion message contains a non-ASCII character.
      - name: Run desktop test suite (must pass, or fail the build)
        run: python -m pytest tests -v
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8

      # Bake the error-report webhook into the build from the repo SECRET (never
      # committed — the repo is public and Slack auto-revokes leaked webhooks).
      # The spec bundles _webhook.cfg if present; absent -> error reporting ships
      # off. Written with no trailing newline so the launcher reads it cleanly.
      - name: Bake error-report webhook (from secret)
        shell: pwsh
        env:
          SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
        run: |
          if ($env:SLACK_ERROR_WEBHOOK) {
            Set-Content -NoNewline -Path "_webhook.cfg" -Value $env:SLACK_ERROR_WEBHOOK
            Write-Host "wrote _webhook.cfg (error reporting ON)"
          } else {
            Write-Host "no SLACK_ERROR_WEBHOOK secret; error reporting OFF"
          }

      - name: Build SecretSauce.exe
        run: pyinstaller SecretSauce.spec --noconfirm --clean
        shell: cmd

      # ----------------------------------------------------------------------
      # BOOT SELF-TEST — the guardrail. Actually launch the packaged .exe on
      # this clean Windows runner and confirm it SERVES. If it can't start
      # (missing hiddenimport like jaraco, bad vendoring, etc.) the app never
      # answers /_stcore/health, this step fails, and the job stops BEFORE the
      # Release is updated — so a non-launching build can never reach a tech.
      # ----------------------------------------------------------------------
      - name: Boot self-test (must serve, or fail the build)
        shell: pwsh
        run: |
          $exe = "dist/SecretSauce/SecretSauce.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          # Redirect the app's stdout/stderr to files so we capture the
          # PyInstaller bootstrap traceback even though it's a windowed (no
          # console) exe — that's where a missing module like jaraco surfaces.
          $out = Join-Path $env:RUNNER_TEMP "ss_out.txt"
          $err = Join-Path $env:RUNNER_TEMP "ss_err.txt"
          Write-Host "Launching $exe (stdout/stderr captured) ..."
          $proc = Start-Process -FilePath $exe -PassThru `
                    -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { Write-Host "process EXITED early, code=$($proc.ExitCode)"; break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" `
                                     -UseBasicParsing -TimeoutSec 2
              if ($r.Content.Trim() -eq "ok") { $ok = $true; break }
            } catch { }
          }
          # clean up the app + any helper processes it spawned
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name SecretSauce -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          # always dump what we captured (helps whether we pass or fail)
          Write-Host "===== captured STDERR ====="
          if (Test-Path $err) { Get-Content $err -Tail 200 } else { Write-Host "(none)" }
          Write-Host "===== captured STDOUT ====="
          if (Test-Path $out) { Get-Content $out -Tail 80 } else { Write-Host "(none)" }
          Write-Host "===== secretsauce.log ====="
          $log = Join-Path $env:USERPROFILE ".secretsauce/secretsauce.log"
          if (Test-Path $log) { Get-Content $log -Tail 80 } else { Write-Host "(none)" }
          if (-not $ok) {
            Write-Error "BOOT SELF-TEST FAILED: packaged app did not serve /_stcore/health. Not publishing."
            exit 1
          }
          Write-Host "BOOT SELF-TEST PASSED: app served /_stcore/health = ok"

      - name: Zip the bundle
        run: powershell -Command "Compress-Archive -Path dist/SecretSauce -DestinationPath SecretSauce-Windows.zip -Force"
        shell: cmd

      - name: Upload the Windows app as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: SecretSauce-Windows
          path: desktop/SecretSauce-Windows.zip
          retention-days: 30

      - name: Publish to a Release (permanent download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release once (ignore "already exists"), then replace the
          # zip in place. The download URL stays the same on every build:
          #   https://github.com/lakeosoyoos/secret-sauce/releases/download/windows-build/SecretSauce-Windows.zip
          gh release create windows-build \
            --title "Secret Sauce — Windows (latest)" \
            --notes "Latest Windows desktop app. Download the zip, right-click → Properties → Unblock, extract, then double-click SecretSauce.exe. First launch takes 10-30s." \
            --latest 2>/dev/null || true
          gh release upload windows-build SecretSauce-Windows.zip --clobber
